<!doctype html>

<title>Kiểm tra tự động</title>
<pre id="out">Đang chạy…</pre>
<script type="module">
/* Kiểm tra tự động: (1) mọi module nạp được, (2) trang khởi động xong được, (3) vài phép tính quan trọng đúng.
   Chạy bằng: sh scripts/check.sh   (mở bằng trình duyệt cũng được: tests/smoke.html?root=/) */
const root = new URLSearchParams(location.search).get('root') ?? '/';
const lines = [], fails = [];
const ok = (name) => lines.push(`ok    ${name}`);
const bad = (name, why) => { lines.push(`FAIL  ${name}: ${why}`); fails.push(name); };
const test = async (name, fn) => { try { await fn(); ok(name); } catch (e) { bad(name, e?.message ?? e); } };
const eq = (a, b, what = '') => { if (JSON.stringify(a) !== JSON.stringify(b)) throw new Error(`${what} mong đợi ${JSON.stringify(b)}, nhận ${JSON.stringify(a)}`); };

// 1. Danh sách module lấy từ sw.js (SHELL) để luôn khớp bản phát hành.
const sw = await (await fetch(`${root}sw.js`, { cache: 'no-store' })).text();
const files = [...new Set([...sw.matchAll(/'(js\/[^']+\.js)'/g)].map((m) => m[1]))].filter((f) => !['js/main.js', 'js/mobileShell.js'].includes(f));   // main và mobileShell chạy thẳng vào giao diện: được kiểm qua bước 2
for (const f of files) await test(`nạp ${f}`, () => import(`${root}${f}`));

// 2. Trang thật khởi động xong (không phiên đăng nhập -> phải hiện màn hình đăng nhập, không kẹt ở màn hình chờ).
await test('trang khởi động (main.js)', async () => {
  const frame = document.createElement('iframe');
  frame.style.cssText = 'width:900px;height:700px';
  frame.src = `${root}index.html?smoke=1`;
  document.body.append(frame);
  await new Promise((r) => { frame.onload = r; });
  const t0 = Date.now();
  while (Date.now() - t0 < 8000) {
    const d = frame.contentDocument;
    if (d.getElementById('boot')?.hidden && d.getElementById('login') && !d.getElementById('login').hidden) return;
    await new Promise((r) => setTimeout(r, 100));
  }
  throw new Error('màn hình chờ không tắt hoặc không hiện màn hình đăng nhập (main.js có thể bị lỗi)');
});

// 3. Phép tính quan trọng.
const sla = await import(`${root}js/sla.js`), det = await import(`${root}js/slaDetail.js`), seg = await import(`${root}js/segment.js`);

const NOW = at('2026-10-30');

});
await test('SLA: phân loại theo ngày lịch', () => {
  eq(det.classify(rec('2026-10-14', '2026-10-21'), NOW).kind, 'ok');
  eq(det.classify(rec('2026-10-14', '2026-10-22'), NOW).kind, 'late-done');
  eq(det.classify(rec('2026-10-15', '2026-10-25'), NOW).kind, 'ok');
  eq(det.classify(rec('2026-10-15', '2026-10-26'), NOW).kind, 'late-done');
  eq(det.classify(rec('2026-10-15', '2026-10-15', 'Chưa làm'), NOW).kind, 'late-open');
  eq(det.classify(rec('2026-10-28', '2026-10-28', 'Chưa làm'), NOW).kind, 'ok');
  eq(det.classify(rec('2026-10-01', '2026-10-30', 'Hủy'), NOW).kind, 'cancel');
});
