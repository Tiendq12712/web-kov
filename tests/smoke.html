<!doctype html>
<meta charset="utf-8">
<title>Kiểm tra tự động</title>
<pre id="out">Đang chạy…</pre>
<script type="module">
/* Kiểm tra tự động: (1) mọi module nạp được, (2) trang khởi động xong được, (3) vài phép tính quan trọng đúng.
   Chạy bằng: sh scripts/check.sh   (mở bằng trình duyệt cũng được: tests/smoke.html?root=/) */
const root = new URLSearchParams(location.search).get('root') ?? '/';
const lines = [], fails = [];
const ok = (name) => lines.push(`ok    ${name}`);
const bad = (name, why) => { lines.push(`FAIL  ${name}: ${why}`); fails.push(name); };
const test = async (name, fn) => { try { await fn(); ok(name); } catch (e) { bad(name, e?.message ?? e); } };
const eq = (a, b, what = '') => { if (JSON.stringify(a) !== JSON.stringify(b)) throw new Error(`${what} mong đợi ${JSON.stringify(b)}, nhận ${JSON.stringify(a)}`); };

// 1. Danh sách module lấy từ sw.js (SHELL) để luôn khớp bản phát hành.
const sw = await (await fetch(`${root}sw.js`, { cache: 'no-store' })).text();
const files = [...new Set([...sw.matchAll(/'(js\/[^']+\.js)'/g)].map((m) => m[1]))].filter((f) => !['js/main.js', 'js/mobileShell.js'].includes(f));   // main và mobileShell chạy thẳng vào giao diện: được kiểm qua bước 2
for (const f of files) await test(`nạp ${f}`, () => import(`${root}${f}`));

// 2. Trang thật khởi động xong (không phiên đăng nhập -> phải hiện màn hình đăng nhập, không kẹt ở màn hình chờ).
await test('trang khởi động (main.js)', async () => {
  const frame = document.createElement('iframe');
  frame.style.cssText = 'width:900px;height:700px';
  frame.src = `${root}index.html?smoke=1`;
  document.body.append(frame);
  await new Promise((r) => { frame.onload = r; });
  const t0 = Date.now();
  while (Date.now() - t0 < 8000) {
    const d = frame.contentDocument;
    if (d.getElementById('boot')?.hidden && d.getElementById('login') && !d.getElementById('login').hidden) return;
    await new Promise((r) => setTimeout(r, 100));
  }
  throw new Error('màn hình chờ không tắt hoặc không hiện màn hình đăng nhập (main.js có thể bị lỗi)');
});

// 3. Phép tính quan trọng.

  const rows = [{ month: '2026-10', created: '2026-10-12', handler: '9001 - An - CS', retailer: '1', add: ['Mua phần cứng', 'Giới thiệu Kship'], status: 'Đã làm' }, { month: '2026-10', created: '2026-10-13', handler: '9002 - Bình - CS', retailer: '2', add: ['Mua phần cứng'], status: 'Đã làm' }];
  const r = ad.analyzeAddonDetail(rows, members, { month: '2026-10' });
  const by = Object.fromEntries(r.byType.map((t) => [t.kind, t]));
  eq(by['Kích hoạt payment thành công'].acts, 3, 'Payment: 3 act từ Sheet Addon (không đếm trùng với data chi tiết)'); eq([by['Giới thiệu Kship'].earned, by['Giới thiệu Kship'].lost], [6, 4], 'Kship: 1đ + 5đ, trừ 4');
  eq(by['Mua phần cứng'].acts, 2, 'đếm số act'); eq([by['Mua phần cứng'].earned, by['Mua phần cứng'].lost], [10, 0], 'loại khác mặc định đủ 5đ mỗi act');
  eq(r.people.find((p) => p.code === '9001').lost, 9, 'tổng điểm trừ của 9001'); eq(r.total.full, (r.total.acts) * 5, 'tổng điểm đủ = 5đ × số act'); eq(r.total.lost, 9 + 5, 'tổng trừ của cả team (9001: 9, 9003: HDDT 5)');
  eq(ad.analyzeAddonDetail(rows, members, { month: '2026-10', code: '9002' }).acts.length, 3, 'xem một nhân sự chỉ thấy act của người đó (2 Payment/Kship + 1 phần cứng)'.length ? 3 : 0);
});

await test('Đồng bộ CRM: cookie hết hạn thì báo rõ, dừng và hướng dẫn nhập lại; cookie cũ có cảnh báo', async () => {

    const run = app.doc.querySelector('[data-act="crm-run"]'); eq(run != null && !run.disabled, true, 'nút chạy bật được');
    run.click(); await sleep(2800);
    const alertBox = app.doc.querySelector('.alert--bad');
    eq(alertBox != null, true, `có thông báo lỗi (lỗi: ${app.errors().join(' | ')})`); eq(alertBox.textContent.includes('Cookie CRM có thể đã hết hạn'), true, 'nêu rõ cookie hết hạn'); eq(alertBox.textContent.includes('đã dừng đồng bộ'), true, 'nói rõ đã dừng đồng bộ');
    eq(alertBox.textContent.includes('lấy cookie CRM mới'), true, 'có hướng dẫn'); eq(alertBox.querySelector('[data-act="focus-cookie"]') != null, true, 'có nút nhập cookie mới');

    app.click('[data-act="alert-close"]'); await sleep(300); eq(app.doc.querySelector('.alert--bad'), null, 'đóng được thông báo');
    eq(app.errors(), [], 'không lỗi chạy');
  } finally { app.stop(); }
});
