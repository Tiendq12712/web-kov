<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, minimum-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#2563eb">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="KPI">
  <title>Báo cáo tiến độ KPI</title>
  <meta name="description" content="web-kov: báo cáo tiến độ KPI, theo dõi công việc và năng suất của đội ngũ chăm sóc khách hàng.">
  <link rel="icon" href="icons/favicon.png" type="image/png" sizes="64x64">
  <link rel="icon" href="icons/icon-192.png" type="image/png" sizes="192x192">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="stylesheet" href="css/styles.css">
  <script>
    try { const t = localStorage.getItem('theme'); if (t) document.documentElement.dataset.theme = t; } catch {}
  </script>
  <script type="module" src="js/main.js"></script>
</head>
<body class="is-booting">
  <div id="boot" class="boot" role="status" aria-live="polite">
    <div class="boot__card">
      <div class="boot__logo" aria-hidden="true">
        <svg class="boot__ring" viewBox="0 0 100 100"><circle class="boot__track" cx="50" cy="50" r="44"/><circle class="boot__arc" cx="50" cy="50" r="44"/></svg>
        <img class="boot__bars" src="icons/mark.png" width="48" height="48" alt="">
      </div>
      <h2 class="boot__title">Tiến độ KPI</h2>
      <p class="boot__text" id="boot-text">Đang khởi động…</p>
      <ol class="boot__steps">
        <li class="boot__step"><i></i>Xác thực</li>
        <li class="boot__step"><i></i>Báo cáo KPI</li>
        <li class="boot__step"><i></i>Năng suất</li>
      </ol>
      <div class="boot__bar" aria-hidden="true"><span></span></div>
    </div>
  </div>
  <header class="topbar">
    <div class="topbar__inner">
      <div class="brand-group">
        <div class="brand">
          <img class="brand__logo" src="icons/mark.png" width="32" height="32" alt="KiotViet">
          <h1 class="brand__title">Tiến độ KPI</h1>
        </div>
      </div>
      <div class="topbar__actions">
        <button id="settings-btn" class="pill pill--primary" type="button" data-tab="settings" aria-label="Thiết lập cấu hình" title="Thiết lập cấu hình" hidden>
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 6h10M18 6h2M4 12h4M12 12h8M4 18h12M20 18h0"/><circle cx="16" cy="6" r="2"/><circle cx="10" cy="12" r="2"/><circle cx="18" cy="18" r="2"/></svg>
          <span>Thiết lập</span>
        </button>
        <label class="visually-hidden" for="month">Chọn tháng</label>
        <select id="month" class="select"></select>
        <span id="user" class="user" hidden><i class="user__avatar" id="user-avatar"></i><span id="user-email"></span></span>
        <button id="logout" class="pill pill--danger" type="button" hidden>
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 4H5v16h4M16 8l4 4-4 4M20 12H9"/></svg>
          <span>Đăng xuất</span>
        </button>
        <button id="help" class="icon-btn" type="button" aria-label="Hướng dẫn sử dụng" title="Hướng dẫn sử dụng">?</button>
        <button id="theme" class="icon-btn" type="button" aria-label="Đổi giao diện sáng/tối">◐</button>
      </div>
    </div>
    <nav class="tabs" id="tabs" aria-label="Chọn team"></nav>
  </header>

  <div id="welcome" class="welcome" hidden></div>
  <main id="view" class="container" aria-live="polite"></main>
  <nav class="bottom-nav" id="bottom-nav" aria-label="Điều hướng chính"></nav>
  <dialog id="detail" class="drawer" aria-label="Chi tiết nhân sự"></dialog>
</body>
</html>
