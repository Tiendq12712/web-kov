<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#2563eb">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="KPI">
  <title>Báo cáo tiến độ KPI</title>
  <link rel="icon" href="icons/icon-192.png" type="image/png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="stylesheet" href="css/styles.css">
  <script>
    try { const t = localStorage.getItem('theme'); if (t) document.documentElement.dataset.theme = t; } catch {}
  </script>
  <script type="module" src="js/main.js"></script>
</head>
<body>
  <header class="topbar">
    <div class="topbar__inner">
      <div class="brand-group">
        <div class="brand">
          <h1 class="brand__title">Tiến độ KPI</h1>
        </div>
      </div>
      <div class="topbar__actions">
        <button id="settings-btn" class="pill pill--primary" type="button" data-tab="settings" aria-label="Thiết lập cấu hình" title="Thiết lập cấu hình" hidden>
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 6h10M18 6h2M4 12h4M12 12h8M4 18h12M20 18h0"/><circle cx="16" cy="6" r="2"/><circle cx="10" cy="12" r="2"/><circle cx="18" cy="18" r="2"/></svg>
          <span>Thiết lập</span>
        </button>
        <label class="visually-hidden" for="month">Chọn tháng</label>
        <select id="month" class="select"></select>
        <span id="user" class="user" hidden><i class="user__avatar" id="user-avatar"></i><span id="user-email"></span></span>
        <button id="logout" class="pill pill--danger" type="button" hidden>
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 4H5v16h4M16 8l4 4-4 4M20 12H9"/></svg>
          <span>Đăng xuất</span>
        </button>
        <button id="theme" class="icon-btn" type="button" aria-label="Đổi giao diện sáng/tối">◐</button>
      </div>
    </div>
    <nav class="tabs" id="tabs" aria-label="Chọn team"></nav>
  </header>

  <main id="view" class="container" aria-live="polite"></main>
  <nav class="bottom-nav" id="bottom-nav" aria-label="Điều hướng chính"></nav>
  <dialog id="detail" class="drawer" aria-label="Chi tiết nhân sự"></dialog>
</body>
</html>
