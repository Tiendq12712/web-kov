<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, minimum-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#2563eb">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Report SC">
  <title>Report SC ONLINE</title>
  <meta name="description" content="web-kov: báo cáo tiến độ KPI, theo dõi công việc và năng suất của đội ngũ chăm sóc khách hàng.">
  <link rel="icon" href="icons/favicon.png" type="image/png" sizes="64x64">
  <link rel="icon" href="icons/icon-192.png" type="image/png" sizes="192x192">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="stylesheet" href="css/styles.css">
  <script>
    try { const t = localStorage.getItem('theme'); if (t) document.documentElement.dataset.theme = t; } catch {}
  </script>
  <script type="module" src="js/main.js"></script>
  <script>
    // Nếu sau 15 giây màn hình chờ vẫn còn (mạng lỗi/tải thiếu tệp), báo cho người dùng thay vì quay mãi.
    setTimeout(() => {
      const text = document.getElementById('boot-text');
      if (document.body.classList.contains('is-booting') && text) text.innerHTML = 'Tải lâu hơn bình thường. <a href="" onclick="location.reload();return false">Tải lại trang</a>';
    }, 15000);
  </script>
</head>
<body class="is-booting">
  <div id="boot" class="boot" role="status" aria-live="polite">
    <div class="boot__card">
      <div class="boot__logo" aria-hidden="true">
        <svg class="boot__ring" viewBox="0 0 100 100"><circle class="boot__track" cx="50" cy="50" r="44"/><circle class="boot__arc" cx="50" cy="50" r="44"/></svg>
        <img class="boot__bars" src="icons/mark.png" width="48" height="48" alt="">
      </div>
      <h2 class="boot__title">Report SC ONLINE</h2>
      <p class="boot__text" id="boot-text">Đang khởi động…</p>
      <ol class="boot__steps">
        <li class="boot__step"><i></i>Xác thực</li>
        <li class="boot__step"><i></i>Báo cáo KPI</li>
        <li class="boot__step"><i></i>Năng suất</li>
      </ol>
      <div class="boot__bar" aria-hidden="true"><span></span></div>
    </div>
  </div>
  <header class="topbar">
    <div class="topbar__inner">
      <div class="brand-group">
        <a class="brand" href="#/" data-tab="overview" title="Về màn hình chính" aria-label="Report SC ONLINE — về màn hình chính">
          <img class="brand__logo" src="icons/mark.png" width="32" height="32" alt="KiotViet">
          <h1 class="brand__title">Report SC ONLINE</h1>
        </a>
      </div>
      <nav class="tabs" id="tabs" aria-label="Điều hướng chính"></nav>
      <div class="topbar__actions">
        <button id="user" class="user" type="button" aria-haspopup="menu" aria-expanded="false" aria-controls="account-menu" title="Tài khoản và tuỳ chọn">
          <i class="user__avatar" id="user-avatar">☰</i><span id="user-email" class="user__email">Menu</span><span class="user__caret" aria-hidden="true">▾</span>
        </button>
      </div>
    </div>
  </header>

  <div id="refresh-bar" class="refresh-bar" role="status" hidden></div>
  <div id="welcome" class="welcome" hidden></div>
  <main id="view" class="container" aria-live="polite"></main>
  <div id="popmenu" class="menu" role="menu" hidden></div>
  <div id="account-menu" class="menu menu--account" role="menu" hidden>
    <p class="menu__who" id="menu-who">Chưa đăng nhập</p>
    <button id="settings-btn" class="menu__item" type="button" role="menuitem" data-tab="settings" hidden>⚙️ Thiết lập</button>
    <button id="help" class="menu__item" type="button" role="menuitem">❓ Hướng dẫn sử dụng</button>
    <button id="theme" class="menu__item" type="button" role="menuitem">◐ Giao diện sáng / tối</button>
    <button id="logout" class="menu__item menu__item--danger" type="button" role="menuitem" hidden>⎋ Đăng xuất</button>
  </div>
  <aside id="coach" aria-live="polite"></aside>
  <nav class="bottom-nav" id="bottom-nav" aria-label="Điều hướng chính"></nav>
  <dialog id="detail" class="drawer" aria-label="Chi tiết nhân sự"></dialog>
</body>
</html>
